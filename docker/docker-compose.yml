# ══════════════════════════════════════════════════════════════════════════════
#  web_auditor — Stack Docker
#  Ubicación: /docker/docker-compose.yml (dentro del repositorio)
#
#  Contenedores separados (por defecto solo el stack web):
#    · db              → PostgreSQL (solo red interna backend)
#    · dashboard-api   → FastAPI (backend + acceso a BD)
#    · dashboard       → Node + React (solo red web; no ve el hostname "db")
#
#  Scraper (Chrome/Selenium, salida a Internet): perfil "scraper", no arranca con "up".
#
#  Redes:
#    · web_auditor_backend → db + quien necesita PostgreSQL (api, scraper)
#    · web_auditor_web     → api + frontend (proxy HTTP interno)
#
#  Ejecución desde la carpeta /docker:
#    docker compose up -d
#
#  Scraper (un ciclo):
#    docker compose --profile scraper run --rm scraper
#
#  Scraper en segundo plano (daemon):
#    docker compose --profile scraper up -d scraper
# ══════════════════════════════════════════════════════════════════════════════

networks:
  backend:
    name: web_auditor_backend
  web:
    name: web_auditor_web

services:

  # ── 1. Base de datos ────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: web_auditor_db
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-web_auditor}
      POSTGRES_USER:     ${POSTGRES_USER:-auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auditor_secret}
      TZ: Europe/Madrid
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Ruta relativa a docker/ → apunta a docker/db-init/
      - ./db-init:/docker-entrypoint-initdb.d:ro
    # No publicar el puerto en el host para evitar acceso externo.
    # Containers en la misma red 'backend' pueden seguir conectándose.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auditor} -d ${POSTGRES_DB:-web_auditor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. Analizador de IA (FastAPI + SentenceTransformers) ─────────────────────
  ai-analyzer:
    build:
      context: ./ai-analyzer
    container_name: web_auditor_ai_analyzer
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
      MODEL_CACHE_DIR: /app/model_cache
    volumes:
      - ai_model_cache:/app/model_cache
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - backend

  # (scraper service merged into `dashboard-api` below)

  # ── 3. Dashboard API (FastAPI) ──────────────────────────────────────────────
  dashboard-api:
    build:
      context: ..
      dockerfile: docker/dashboard/api/Dockerfile
    container_name: web_auditor_dashboard_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     ${POSTGRES_DB:-web_auditor}
      DB_USER:     ${POSTGRES_USER:-auditor}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-auditor_secret}
      AI_ANALYZER_URL: http://ai-analyzer:8080
      # Intervalo en segundos; <=0 = ejecución única en arranque. Establecer >0 para modo daemon.
      RUN_INTERVAL_SECONDS: ${RUN_INTERVAL_SECONDS:-60}
      TZ: Europe/Madrid
    volumes:
      # Montar código fuente para hot reload
      - ../shared:/app/shared:ro
      - ./dashboard/api/main.py:/app/main.py:ro
      - ./dashboard/api/app.py:/app/app.py:ro
      - ./dashboard/api/schemas:/app/schemas:ro
      - ./dashboard/api/routes:/app/routes:ro
      # Scraper-related mounts (merged)
      - ./scraper_logs:/app/logs
      - ../data:/app/data
      - ../config:/app/config
      - ../scraper:/app/scraper:ro
      - ./scraper/entrypoint.py:/app/entrypoint.py:ro
      - ./scraper/scheduler.py:/app/scheduler.py:ro
      - ./scraper/service.py:/app/service.py:ro
    # Also run the scraper process in the same container (development-friendly)
    # Runs scraper in background and then starts uvicorn (hot-reload for API)
    command: sh -c "python /app/entrypoint.py > /app/logs/scraper.log 2>&1 & uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    shm_size: "2gb"
    networks:
      - backend
      - web

  # ── 4. Dashboard frontend Node + React ──────────────────────────────────────
  dashboard:
    build:
      # Contexto = docker/dashboard/ (no necesita el repo Python)
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: web_auditor_dashboard
    restart: unless-stopped
    depends_on:
      dashboard-api:
        condition: service_started
    environment:
      PORT: 3000
      API_BASE_URL: http://dashboard-api:8000
      TZ: Europe/Madrid
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    command: npx nodemon server.js
    volumes:
      - ./dashboard/frontend:/app/frontend:ro
      - ./dashboard/server.js:/app/server.js:ro
    networks:
      - web

# ── Volúmenes ────────────────────────────────────────────────────────────────
volumes:
  pg_data:
    driver: local
  ai_model_cache:
    driver: local
